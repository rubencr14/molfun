_target_: model.torch.architecture.FoldingDiT

hidden_size: 64
num_heads: 4
atom_num_heads: 2
output_channels: 3
use_atom_mask: False
use_length_condition: True
esm_dropout_prob: 0.0
esm_model: esm2_8M

time_embedder:
  _target_: model.torch.layers.TimestepEmbedder
  hidden_size: 64

aminoacid_pos_embedder:
  _target_: model.torch.pos_embed.AbsolutePositionEncoding
  in_dim: 1
  embed_dim: 64
  include_input: True

pos_embedder:
  _target_: model.torch.pos_embed.FourierPositionEncoding
  in_dim: 3
  include_input: True
  min_freq_log2: 0
  max_freq_log2: 12
  num_freqs: 16
  log_sampling: True

trunk:
  _target_: model.torch.blocks.HomogenTrunk
  depth: 2
  block:
    _target_: model.torch.blocks.DiTBlock
    _partial_: True
    hidden_size: 64
    mlp_ratio: 2.0
    use_swiglu: True
    self_attention_layer:
      _target_: model.torch.layers.EfficientSelfAttentionLayer
      _partial_: True
      hidden_size: 64
      num_heads: 4
      qk_norm: True
      pos_embedder:
        _target_: model.torch.pos_embed.AxialRotaryPositionEncoding
        in_dim: 4
        embed_dim: 64
        num_heads: 4
        base: 100.0

atom_hidden_size_enc: 32
atom_n_queries_enc: 32
atom_n_keys_enc: 128
atom_encoder_transformer:
  _target_: model.torch.blocks.HomogenTrunk
  depth: 1
  block:
    _target_: model.torch.blocks.DiTBlock
    _partial_: True
    hidden_size: 32
    mlp_ratio: 2.0
    use_swiglu: True
    self_attention_layer:
      _target_: model.torch.layers.EfficientSelfAttentionLayer
      _partial_: True
      hidden_size: 32
      num_heads: 2
      qk_norm: True
      pos_embedder:
        _target_: model.torch.pos_embed.AxialRotaryPositionEncoding
        in_dim: 4
        embed_dim: 32
        num_heads: 2
        base: 100.0

atom_hidden_size_dec: 32
atom_n_queries_dec: 32
atom_n_keys_dec: 128
atom_decoder_transformer:
  _target_: model.torch.blocks.HomogenTrunk
  depth: 1
  block:
    _target_: model.torch.blocks.DiTBlock
    _partial_: True
    hidden_size: 32
    mlp_ratio: 2.0
    use_swiglu: True
    self_attention_layer:
      _target_: model.torch.layers.EfficientSelfAttentionLayer
      _partial_: True
      hidden_size: 32
      num_heads: 2
      qk_norm: True
      pos_embedder:
        _target_: model.torch.pos_embed.AxialRotaryPositionEncoding
        in_dim: 4
        embed_dim: 32
        num_heads: 2
        base: 100.0
